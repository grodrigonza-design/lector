plugins {
    id 'com.android.application'
}

android {
    namespace 'cr.portarretratos'
    compileSdk 34

    defaultConfig {
        applicationId 'cr.portarretratos'
        minSdk 19          // Android 4.4 (la tablet Digiland DL701Q)
        //noinspection ExpiredTargetSdkVersion: la app es solo para esa tablet; así no pide permisos en tiempo de ejecución
        targetSdk 22
        versionCode 1
        // Conscrypt trae código nativo: solo los procesadores comunes en tablets
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86' }
        versionName '1.0'
    }

    // Firma fija: así cada versión nueva se puede instalar encima de la anterior
    // sin desinstalar (desinstalar borraría las fotos subidas desde el teléfono).
    signingConfigs {
        fija {
            storeFile file('portarretratos.keystore')
            storePassword 'portarretratos'
            keyAlias 'portarretratos'
            keyPassword 'portarretratos'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fija }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Los marcos y el fechas.txt de la carpeta tarjeta-sd van también dentro de la app,
    // para que funcione sin tarjeta SD (todo se maneja desde el teléfono).
    sourceSets {
        main {
            assets.srcDirs += ['../tarjeta-sd']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Conexiones seguras modernas (TLS 1.3, cifrados actuales) en Android 4.4,
    // que si no, no logra conectarse a muchos sitios (clima, GitHub…).
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
