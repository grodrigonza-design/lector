name: Portarretratos (APK)

on:
  push:
    paths:
      - 'portarretratos/**'
      - '.github/workflows/portarretratos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portarretratos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Preparar descarga
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/Portarretratos.apk
          cp -r tarjeta-sd/Portarretratos salida/
          rm -f salida/Portarretratos/fotos/.gitkeep
          cp LEEME.md MARCOS.md salida/
      - uses: actions/upload-artifact@v4
        with:
          name: Portarretratos
          path: portarretratos/salida/
      - name: Publicar descarga directa (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd salida && zip -qr ../Portarretratos.zip .)
          cp salida/Portarretratos.apk Portarretratos.apk
          gh release delete portarretratos --yes --cleanup-tag || true
          gh release create portarretratos Portarretratos.zip Portarretratos.apk \
            --target "$GITHUB_SHA" --latest=false \
            --title "Portarretratos (última versión)" \
            --notes "Descargue Portarretratos.zip, descomprímalo y copie su contenido a la raíz de la tarjeta SD. Instrucciones en LEEME.md."
